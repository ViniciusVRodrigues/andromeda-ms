# Docker Desktop não deixa o container alcançar a porta 127.0.0.1:9090 do host; por isso o nginx
# de teste entra na andromeda-net e resolve o nome do blue a cada requisição (some quando o
# blue para, como a porta na VPS).
server {
  listen 80;
  resolver 127.0.0.11 valid=1s;
  location / {
    set $ms http://andromeda-ms-blue:9090;
    proxy_pass $ms;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
  }
}
