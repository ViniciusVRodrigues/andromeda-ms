spring:
  application:
    name: andromeda-ms
  config:
    import: optional:file:./.env[.properties]  # carrega segredos locais; ignorado se o arquivo não existir
  data:
    mongodb:
      uri: mongodb://admin:secret@localhost:27018/andromeda?authSource=admin
      # Índices: os @CompoundIndex/@Indexed dos documentos são criados no startup pelo
      # DeclaredIndexInitializer, um por vez — uma falha (ex.: unique sobre duplicatas) vira
      # WARN e o app sobe. Não use spring.data.mongodb.auto-index-creation: com o MongoConfig
      # atual (AbstractMongoClientConfiguration) ela é ignorada, e sem ele a criação automática
      # derrubaria o startup a cada índice com problema.
  mvc:
    # O DevTools liga isto e loga a exceção resolvida inteira, com o valor rejeitado de uma
    # validação (pode ser dado pessoal). O GlobalExceptionHandler já loga só campo e código.
    log-resolved-exception: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:disabled}
            client-secret: ${GITHUB_CLIENT_SECRET:disabled}
            scope: read:user,user:email
            redirect-uri: "${app.frontend-url}/api/v1/auth/oauth2/callback/{registrationId}"
          azure:
            client-id: ${AZURE_CLIENT_ID:disabled}
            client-secret: ${AZURE_CLIENT_SECRET:disabled}
            scope: offline_access,499b84ac-1321-427f-aa17-267ca6975798/user_impersonation
            authorization-grant-type: authorization_code
            redirect-uri: "${app.frontend-url}/api/v1/auth/oauth2/callback/{registrationId}"
        provider:
          azure:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

jackson:
  serialization:
    write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:9090}

security:
  jwt:
    secret: ${JWT_SECRET}  # Obrigatório — defina em .env (local) ou na env da plataforma (dev/prod)
    expiration-ms: 86400000  # 24h

andromeda:
  agent:
    min-version: ${AGENT_MIN_VERSION:0.1.0}
    recommended-version: ${AGENT_RECOMMENDED_VERSION:0.1.0}
    package-name: ${AGENT_PACKAGE_NAME:andromeda-agent}
    node-min: ${AGENT_NODE_MIN:22}
    privacy-url: ${AGENT_PRIVACY_URL:}
    task-clear-command: ${AGENT_TASK_CLEAR_COMMAND:andromeda task --clear}
    stale-after: P3D
    rate-limit:
      code-per-ip: ${AGENT_RATE_LIMIT_CODE_PER_IP:100}
      token-per-ip: ${AGENT_RATE_LIMIT_TOKEN_PER_IP:1200}
      token-per-credential: ${AGENT_RATE_LIMIT_TOKEN_PER_CREDENTIAL:30}
    access-token-ttl: PT1H
    refresh-token-ttl: P90D
    refresh-grace: PT2M
    device-code-ttl: PT10M
    poll-interval: 5
    max-rows-per-batch: 500
    uploads-per-minute: 60
    batch-replay-ttl: P7D
    batch-claim-lease: PT10M      # lote "em andamento" mais velho que isto (ms parou no meio) é retomado (AGT10)
    batch-in-progress-wait: PT5S  # o reenvio de um lote em andamento espera isto pela resposta; depois, 409
    max-row-age: P90D
    accept-estimated: false
  telemetry:
    enabled: ${TELEMETRY_ENABLED:true}  # chave de desligar a coleta de uso (usage_events); lastLoginAt grava sempre

azure:
  encryption-key: ${AZURE_ENCRYPTION_KEY}
  client-id: ${AZURE_CLIENT_ID:disabled}
  client-secret: ${AZURE_CLIENT_SECRET:disabled}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:noreply@andromeda.app}
  sender-name: ${BREVO_SENDER_NAME:Andrômeda}

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:false}  # false por padrão — defina true em dev/prod com Brevo configurado
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  oauth:
    cookie-secure: true  # cookie do nonce do OAuth; false so no perfil local (http)
---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      uri: mongodb://admin:secret@localhost:27018/andromeda?authSource=admin
app:
  oauth:
    cookie-secure: false  # http local

---
spring:
  config:
    activate:
      on-profile: dev,prod
  data:
    mongodb:
      uri: ${MONGODB_URI}
