name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Docker version (diagnóstico)
        run: docker version

      - name: Run tests
        run: ./gradlew check
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Containers (diagnóstico)
        if: failure()
        run: docker ps -a && for c in $(docker ps -aq); do echo "== $c"; docker logs --tail 30 $c 2>&1; done

      - name: Build JAR
        run: ./gradlew build -x test
