name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    # ubuntu-22.04 (kernel 6.8): o ubuntu-24.04 de 2026-10-25 tem kernel 6.19+, onde o MongoDB 8.0
    # não sobe (SERVER-121912) e todos os testes com Testcontainers falham. Voltar quando houver kernel 7.0.14+.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run tests
        run: uname -r && ./gradlew check

      - name: Build JAR
        run: ./gradlew build -x test
