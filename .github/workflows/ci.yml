name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Docker version (diagnóstico)
        run: uname -r && docker version

      - name: Mongo probe (diagnóstico)
        run: docker run -d --name probe mongo:8.0 --replSet rs && sleep 10 && docker ps -a && docker logs probe 2>&1 | tail -5 && docker context ls && env | grep -i -E "docker|testcontainers" || true; ls -la ~/.testcontainers.properties ~/.docker 2>&1 || true

      - name: Run tests
        run: ./gradlew check
        env:
          TC_DIAG: "1"

      - name: Containers (diagnóstico)
        if: failure()
        run: docker ps -a && for c in $(docker ps -aq); do echo "== $c"; docker logs --tail 30 $c 2>&1; done

      - name: Build JAR
        run: ./gradlew build -x test
