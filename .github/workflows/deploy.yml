name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/viniciusvrodrigues/andromeda-ms

jobs:
  test-build-deploy:
    name: Test → Build → Deploy
    # ubuntu-22.04: mesmo motivo do ci.yml (MongoDB 8.0 não sobe no kernel 6.19+, SERVER-121912).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run tests
        run: ./gradlew check

      - name: Build JAR
        run: ./gradlew build -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      # O script vem do repositório: o deploy não depende mais de uma cópia mantida à mão na VPS.
      - name: Copy deploy script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: scripts/deploy-ms.sh
          target: scripts/incoming
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # O ssh-action v1 não tem mais script_stop: sem set -e o passo herdaria o status
            # do último comando, e um deploy-ms.sh que falha passaria como sucesso.
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u viniciusvrodrigues --password-stdin
            # Instala o script do repositório. O diff mostra no log o que mudou em relação à
            # cópia da VPS, e o .bak guarda a cópia antiga para voltar atrás.
            if [ -f ~/scripts/deploy-ms.sh ]; then
              diff -u ~/scripts/deploy-ms.sh ~/scripts/incoming/deploy-ms.sh || true
              cp ~/scripts/deploy-ms.sh ~/scripts/deploy-ms.sh.bak
            else
              echo "Sem deploy-ms.sh anterior na VPS: primeira instalação"
            fi
            install -m 755 ~/scripts/incoming/deploy-ms.sh ~/scripts/deploy-ms.sh
            IMAGE=${{ env.IMAGE }}:sha-${{ github.sha }} \
            ENV_FILE=${{ secrets.VPS_MS_ENV_FILE }} \
            ~/scripts/deploy-ms.sh
            # Garante aqui que o ms promovido volta sozinho quando a JVM sai
            # (ExitOnOutOfMemoryError): unless-stopped reinicia depois de uma saída e não traz
            # de volta o que o deploy parou ou removeu de propósito.
            docker update --restart unless-stopped andromeda-ms-blue
            docker inspect -f 'andromeda-ms-blue restart={{.HostConfig.RestartPolicy.Name}} entrypoint={{json .Config.Entrypoint}}' andromeda-ms-blue
